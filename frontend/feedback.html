<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Student Feedback</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>All Student Feedback</h1>
        <p>View and manage submitted feedback.</p>
    </header>

    <main>
        <section class="feedback-section">
            <div class="section-heading">
                <h2>Feedback List</h2>

                <div>
                    <button type="button" id="loadFeedback">
                        Refresh Feedback
                    </button>

                    <button type="button" id="clearAllFeedback">
                        Clear All
                    </button>
                </div>
            </div>

            <div id="feedbackList">
                <p>Loading feedback...</p>
            </div>

            <p>
                <a href="index.html">Back to Feedback Form</a>
            </p>
        </section>
    </main>

    <script src="feedback.js"></script>
</body>
</html>
